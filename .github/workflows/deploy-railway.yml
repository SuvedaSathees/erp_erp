# Deploys the app to Railway (project magnertia_ERP, service erp_erp) on every push to main.
# Needs one repository secret: RAILWAY_TOKEN — a Railway *project* token for the production
# environment (Railway → magnertia_ERP → Settings → Tokens). Without it the job is skipped.
name: Deploy to Railway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN secret is not set; skipping deploy."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - name: Install Railway CLI
        if: steps.token.outputs.present == 'true'
        run: npm install -g @railway/cli

      # Uploads the code; Railway builds and deploys it (build logs are in the Railway dashboard).
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: railway up --service erp_erp --detach
