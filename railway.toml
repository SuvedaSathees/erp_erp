[build]
buildCommand = "npm run build"

[deploy]
# Run node directly (no npm/bun wrapper process) with a capped heap to keep memory billing low.
startCommand = "node --max-old-space-size=256 .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
